<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>TP3 – Exo 1 (Globe 3D)</title>
  <style>
    html, body { height: 100%; margin: 0; background:#000; color:#ddd; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #hud {
      position: fixed; top: 8px; left: 8px; background: rgba(0,0,0,.5);
      padding: 8px 10px; border-radius: 8px; font-size: 14px; line-height: 1.35;
      backdrop-filter: blur(4px);
    }
    #hud a { color: #8ec7ff; text-decoration: none; }
    #map {
      position: fixed;
      left: 12px; bottom: 12px;
      width: min(32vw, 420px);
      height: min(32vh, 280px);
      border-radius: 10px; overflow: hidden;
      box-shadow: 0 8px 24px rgba(0,0,0,.35);
      z-index: 10;
    }
  </style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
</head>
<body>
  <div id="app"></div>
  <div id="hud">
    <div><strong>Contrôles :</strong> clic & drag = orbiter, molette = zoom</div>
    <div>Ta position = <span id="you">…</span></div>
  </div>
  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <!-- Three.js (module) + OrbitControls depuis un CDN fiable -->
  <script type="module">
    import * as THREE from 'https://esm.sh/three@0.160.0';
    import { OrbitControls } from 'https://esm.sh/three@0.160.0/examples/jsm/controls/OrbitControls.js';

    // === 1) Scène + caméra + renderer ===
    const app = document.getElementById('app');
    const scene = new THREE.Scene();
    const globeGroup = new THREE.Group();
    scene.add(globeGroup);
    scene.background = new THREE.Color(0x000000);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.6, 3);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    app.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.zoomSpeed = 3.5;           // accélère le zoom au trackpad/roulette
    controls.zoomToCursor = false;      // garder la rotation centrée sur l'origine
    controls.minDistance = 1.25;        // distance mini (évite de rentrer dans le globe)
    controls.maxDistance = 10;           // distance maxi
    controls.dampingFactor = 0.06;      // amorti un peu plus marqué
    controls.enablePan = false;         // empêche le décalage latéral
    controls.target.set(0, 0, 0);       // cible = centre du globe
    camera.lookAt(0, 0, 0);

    // === Leaflet mini-carte ===
    const map = L.map('map', { zoomControl: true, attributionControl: false }).setView([20, 0], 2);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 6 }).addTo(map);
    let lMarker = null;
    function setMapFocus(lat, lon, zoom = 4){
      if (lMarker) lMarker.setLatLng([lat, lon]);
      else lMarker = L.marker([lat, lon]).addTo(map);
      map.setView([lat, lon], zoom, { animate: true });
    }
    // Carte -> 3D : clic sur la carte recadre le globe
    map.on('click', (e) => {
      const { lat, lng } = e.latlng;
      focusOn(lat, lng);
      setMapFocus(lat, lng, 4);
    });

    let autoRotate = true;

    // === Picking (raycaster) ===
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let hovered = null;

    function onClick(event){
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(globeGroup.children, true);
      const spriteHit = intersects.find(i => i.object.isSprite);
      if (spriteHit){
        const { lat, lon } = spriteHit.object.userData || {};
        if (typeof lat === 'number' && typeof lon === 'number'){
          focusOn(lat, lon);
          setMapFocus(lat, lon, 4);
          return;
        }
      }
      // sinon: clic sur la surface du globe
      const globeHit = intersects.find(i => i.object === globe);
      if (globeHit){
        const local = globeHit.point.clone();      // point en monde
        globe.worldToLocal(local);                 // -> espace local du globe
        const { lat, lon } = vec3ToLatLon(local);
        focusOn(lat, lon); // centre l'écran sur le point cliqué
        setMapFocus(lat, lon, 4);
      }
    }
    renderer.domElement.addEventListener('click', onClick);

    function onMove(event){
      const rect = renderer.domElement.getBoundingClientRect();
      mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
      mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const intersects = raycaster.intersectObjects(globeGroup.children, true);
      const hit = intersects.find(i => i.object.isSprite);
      renderer.domElement.style.cursor = hit ? 'pointer' : 'default';
    }
    renderer.domElement.addEventListener('mousemove', onMove);

    // Centre la planète sur une lat/lon (amène le pays au centre de l'écran)
    const DEG2RAD = Math.PI / 180; 
    const RAD2DEG = 180 / Math.PI;
    function vec3ToLatLon(v){
      const n = v.clone().normalize();
      const y = Math.min(1, Math.max(-1, n.y)); // clamp pour éviter asin hors domaine
      const lat = Math.asin(y) * RAD2DEG;           // φ
      const lon = Math.atan2(-n.z, n.x) * RAD2DEG;  // λ (cohérent avec z = -cosφ * sinλ)
      return { lat, lon };
    }// (si déjà défini plus bas, ce doublon sera ignoré par l'éditeur JS)
    function focusOn(latDeg, lonDeg){
      // Aligne le point (lat,lon) avec la direction de vue de la caméra
      const pLocal = latLonToVector3(latDeg, lonDeg, 1).normalize();
      // direction de ce point dans le monde avec l'orientation actuelle
      const pWorld = pLocal.clone().applyQuaternion(globeGroup.quaternion).normalize();
      // direction de vue réelle de la caméra (de la caméra vers la cible des contrôles)
      const vd = controls.target.clone().sub(camera.position).normalize();
      const viewDir = (pWorld.dot(vd) < 0) ? vd.negate() : vd; // évite l'antipode
      // quaternion Delta qui aligne pWorld -> viewDir
      const qDelta = new THREE.Quaternion().setFromUnitVectors(pWorld, viewDir);
      // quaternion cible = qDelta * qCurrent
      const startQ = globeGroup.quaternion.clone();
      const targetQ = startQ.clone().premultiply(qDelta);

      // --- Roll correction: keep North up (align globe's geographic North with screen-up) ---
      const worldUp = new THREE.Vector3(0, 1, 0);
      // tangent vers le Nord au point AVANT qDelta (dans le monde)
      const n_pre = pWorld.clone();
      const northTan_pre = worldUp.clone().sub(n_pre.clone().multiplyScalar(worldUp.dot(n_pre))).normalize();
      // applique qDelta à ce tangent pour obtenir le tangent Nord APRÈS recentrage
      const northTan_after = northTan_pre.clone().applyQuaternion(qDelta).normalize();
      // up écran = up caméra projeté sur le plan perpendiculaire à la direction de vue
      const vdNorm = viewDir.clone().normalize();
      const projUp = camera.up.clone().sub(vdNorm.clone().multiplyScalar(camera.up.dot(vdNorm))).normalize();
      // angle SIGNÉ pour faire coïncider northTan_after -> projUp autour de l'axe vdNorm
      const crossNP = new THREE.Vector3().crossVectors(northTan_after, projUp);
      const dotNP = THREE.MathUtils.clamp(northTan_after.dot(projUp), -1, 1);
      const ang = Math.atan2(crossNP.dot(vdNorm), dotNP);
      const qRoll = new THREE.Quaternion().setFromAxisAngle(vdNorm, ang);
      const finalQ = targetQ.clone().premultiply(qRoll);

      const duration = 800; // ms
      const t0 = performance.now();
      const prevEnabled = controls.enabled;
      controls.enabled = false;

      function easeInOutQuad(t){ return t<0.5 ? 2*t*t : -1+(4-2*t)*t; }

      function animate(){
        const t = Math.min(1, (performance.now()-t0)/duration);
        const e = easeInOutQuad(t);
        globeGroup.quaternion.slerpQuaternions(startQ, finalQ, e);
        if (t < 1) requestAnimationFrame(animate); else controls.enabled = prevEnabled;
      }
      requestAnimationFrame(animate);
    }

    // Ajuster la taille des drapeaux pour conserver une taille visuelle constante
    const baseScale = 0.035; // base plus petite
    function updateFlagScales() {
      const distance = camera.position.length(); // distance caméra-centre
      const s = baseScale * (distance / 3); // à ~3 unités, taille = baseScale
      scene.traverse(obj => {
        if (obj.isSprite && obj.material?.map) {
          obj.scale.set(s, s, 1);
        }
      });
    }

    // === 2) Lumières ===
    scene.add(new THREE.AmbientLight(0xffffff, 0.45));
    const dirLight = new THREE.DirectionalLight(0xffffff, 1.0);
    dirLight.position.set(5, 3, 2);
    scene.add(dirLight);

    // === 3) Globe: sphère de rayon 1 texturée ===
    const RADIUS = 1; // valeur réelle demandée
    const globeGeo = new THREE.SphereGeometry(RADIUS, 96, 64);
    const earthTex = new THREE.TextureLoader().load('./assets/earth.jpg');
    const globeMat = new THREE.MeshPhongMaterial({
      map: earthTex,
      specular: 0x222222,
      shininess: 8
    });
    globeMat.polygonOffset = true;
    globeMat.polygonOffsetFactor = 1;
    globeMat.polygonOffsetUnits = 1;
    const globe = new THREE.Mesh(globeGeo, globeMat);
    globe.name = 'globe';
    globeGroup.add(globe);

    // Optionnel: étoiles (simple particule pour fond)
    const stars = (() => {
      const geo = new THREE.BufferGeometry();
      const N = 2000, positions = new Float32Array(N * 3);
      for (let i=0;i<N;i++){
        const r = 30 + Math.random()*20;
        const theta = Math.random()*Math.PI*2;
        const phi = Math.acos(2*Math.random()-1);
        positions[3*i+0] = r*Math.sin(phi)*Math.cos(theta);
        positions[3*i+1] = r*Math.cos(phi);
        positions[3*i+2] = r*Math.sin(phi)*Math.sin(theta);
      }
      geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({ size: 0.06, transparent:true, opacity:0.8 });
      return new THREE.Points(geo, mat);
    })();
    scene.add(stars);

    // === 4) Conversion Lat/Lon -> coordonnées cartésiennes ===
    // Convention:
    //  - latitude φ (Sud–Nord) en degrés, longitude λ (Ouest–Est) en degrés
    //  - +Y = Nord, +X ≈ longitude 0° (Greenwich) quand lonOffset=0, +Z vers l'observateur
    //  - Pour coller à la texture equirectangulaire, on utilise z = -cosφ * sinλ
    function latLonToVector3(latDeg, lonDeg, radius = RADIUS, lonOffsetDeg = 0){
      const phi = latDeg * DEG2RAD;                             // latitude
      const lambda = (lonDeg + lonOffsetDeg) * DEG2RAD;         // longitude
      const x = radius * Math.cos(phi) * Math.cos(lambda);
      const y = radius * Math.sin(phi);
      const z = -radius * Math.cos(phi) * Math.sin(lambda);     // signe - pour correspondre au mapping
      return new THREE.Vector3(x, y, z);
    }

    // === 5) Fabrique de marqueurs ===
    function makeDotMarker(color = 0xff5555, size = 0.02){
      const geo = new THREE.SphereGeometry(size, 12, 12);
      const mat = new THREE.MeshBasicMaterial({ color });
      return new THREE.Mesh(geo, mat);
    }

    function makeCircleMarker(size = 0.012, fill = '#6ec6ff', border = '#ffffff'){
      const px = 256;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = px;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0,0,px,px);
      // ombre douce
      ctx.shadowColor = 'rgba(0,0,0,0.35)';
      ctx.shadowBlur = 18;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 4;
      // disque
      ctx.beginPath();
      ctx.arc(px/2, px/2, px*0.38, 0, Math.PI*2);
      ctx.fillStyle = fill;
      ctx.fill();
      // bord fin
      ctx.lineWidth = px*0.06;
      ctx.strokeStyle = border;
      ctx.stroke();
      const tex = new THREE.CanvasTexture(canvas);
      tex.anisotropy = 16;
      const mat = new THREE.SpriteMaterial({ map: tex, depthTest: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(size, size, 1);
      return sprite;
    }

    // Sprite drapeau (circular marker)
    async function makeFlagSprite(url, scale = 0.06){
      const image = await new Promise(resolve => {
        const img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = () => resolve(img);
        img.src = url;
      });

      const size = 256;
      const canvas = document.createElement('canvas');
      canvas.width = canvas.height = size;
      const ctx = canvas.getContext('2d');
      ctx.beginPath();
      ctx.arc(size/2, size/2, size/2, 0, Math.PI*2);
      ctx.closePath();
      ctx.clip();
      ctx.drawImage(image, 0, 0, size, size);
      const tx = new THREE.CanvasTexture(canvas);
      tx.minFilter = THREE.LinearFilter;
      tx.magFilter = THREE.LinearFilter;
      tx.anisotropy = 16; // improves sharpness

      const mat = new THREE.SpriteMaterial({ map: tx, depthTest: true, depthWrite: false });
      const sprite = new THREE.Sprite(mat);
      sprite.scale.set(scale, scale, 1);
      return sprite;
    }

    // Oriente un objet pour qu'il "sorte" radialement de la surface
    function faceOutward(obj, pos){
      obj.position.copy(pos);
      obj.lookAt(pos.clone().multiplyScalar(2)); // face normale
    }

    // === 6) Ta position (géolocalisation navigateur) ===
    const youSpan = document.getElementById('you');
    if ('geolocation' in navigator) {
      navigator.geolocation.getCurrentPosition(async (gpos) => {
        const { latitude, longitude } = gpos.coords;
        youSpan.textContent = `${latitude.toFixed(4)}, ${longitude.toFixed(4)}`;
        const p = latLonToVector3(latitude, longitude, RADIUS + 0.02);
        const you = makeDotMarker(0x00ff88, 0.025);
        faceOutward(you, p);
        globeGroup.add(you);
      }, (err) => {
        youSpan.textContent = `refusé (${err.code})`;
      }, { enableHighAccuracy: true, timeout: 7000, maximumAge: 60000 });
    } else {
      youSpan.textContent = 'non disponible';
    }

    // === 7) Quelques pays (coords + drapeaux via restcountries) ===
    // On prend un petit sous-ensemble pour l’exemple

    async function addCountryMarkers() {
      try {
        const res = await fetch('https://restcountries.com/v3.1/all?fields=name,latlng,flags');
        const all = await res.json();
        const pick = all.filter(c => c.latlng && c.flags);
        for (const c of pick) {
          const [lat, lon] = c.latlng; // [lat, lon] en degrés
          const pos = latLonToVector3(lat, lon, RADIUS + 0.008); // plus proche de la surface

          // Un point sous le drapeau pour viser précisément l’emplacement
          const dot = makeCircleMarker(0.012, '#6ec6ff', '#ffffff');
          faceOutward(dot, pos);
          globeGroup.add(dot);

          // Drapeau comme sprite légèrement au-dessus
          const flag = await makeFlagSprite(c.flags?.png || c.flags?.svg || '');
          const up = pos.clone().normalize().multiplyScalar(0.015); // petit décalage radial anti z-fighting
          faceOutward(flag, pos.clone().add(up));
          flag.userData.lat = lat;
          flag.userData.lon = lon;
          flag.userData.name = c.name?.common || '';
          // scene.add(flag);
          globeGroup.add(flag);
          // Facultatif: petite orbite pour une micro-animation
          // (supprimé)
        }
      } catch (e) {
        console.warn('Erreur RestCountries:', e);
      }
    }
    addCountryMarkers();

    // === 8) Animation ===
    function tick(t){
      controls.target.set(0, 0, 0);
      controls.update();
      // if (autoRotate) globeGroup.rotation.y += 0.0006; // légère rotation de la Terre

      // swing subtil des drapeaux (supprimé)

      updateFlagScales();

      renderer.render(scene, camera);
      requestAnimationFrame(tick);
    }
    requestAnimationFrame(tick);

    // === 9) Resize ===
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
